<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herdr Orchestrator Inbox — demo</title>
<style>
:root{--bg:#111315;--chrome:#0d0f11;--surface:#171a1e;--raised:#20242a;--border:#292e35;--line:#343a43;--fg:#e7e9ec;--muted:#979da6;--dim:#656b74;--red:#ef6b63;--blue:#72a9ff;--amber:#d5ad55;--green:#66c38f;--violet:#b59cff;--sidebar:374px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0c;color:var(--fg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:1728px;height:1080px;background:var(--bg);display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:48px 1fr;box-shadow:0 30px 100px #000}.top-left,.top{background:var(--chrome);border-bottom:1px solid var(--border);display:flex;align-items:center}.top-left{padding:0 18px;gap:12px;border-right:1px solid var(--border)}.brand-mark{width:22px;height:22px;border-radius:6px;background:#d4d6d8;color:#111;display:grid;place-items:center;font-weight:900;font-size:13px}.brand{font-weight:650}.top{padding:0 12px;gap:8px}.tab{height:34px;padding:0 13px;border:1px solid var(--border);background:#1b1f23;border-radius:9px;display:flex;align-items:center;gap:8px;font-size:13px}.tab-icon{color:var(--amber)}.tab-close{color:var(--dim);margin-left:4px}.top-spacer{flex:1}.demo-pill{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:5px 8px}.sidebar{grid-column:1;grid-row:2;background:var(--chrome);border-right:1px solid var(--border);min-height:0;display:flex;flex-direction:column;position:relative}.inbox-head{height:82px;padding:16px 18px 12px;border-bottom:1px solid var(--border)}.head-row{display:flex;align-items:center}.head-title{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px}.archive{width:15px;height:13px;border:1.5px solid var(--muted);border-radius:2px;position:relative}.archive:before{content:"";position:absolute;left:-2px;right:-2px;top:-4px;height:2px;background:var(--muted);border-radius:2px}.attention-total{margin-left:auto;min-width:24px;height:24px;border-radius:12px;background:#3b2221;color:#ff8881;display:grid;place-items:center;font-size:11px;font-weight:700}.machine-count{margin:9px 0 0 24px;font-size:10.5px;color:var(--dim)}.current{margin:12px 10px 8px;height:64px;border:1px solid var(--border);border-radius:9px;background:#171a1e;display:flex;align-items:center;padding:0 11px;gap:10px;position:relative}.current:before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--amber)}.agent-icon{width:31px;height:31px;border-radius:7px;background:#292d33;display:grid;place-items:center;margin-left:7px;color:#e57d5f;font-size:15px;flex:0 0 auto}.row-copy{min-width:0;flex:1}.row-title{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-sub{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{color:var(--dim);font-size:12px}.child-count{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:4px}.section{border-top:1px solid #15181c}.section-head{height:38px;padding:0 14px;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.section-head strong{font-weight:600}.section-head .count{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--raised);display:grid;place-items:center;font-size:10px}.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;flex:0 0 auto}.dot.fill{background:currentColor}.red{color:var(--red)}.blue{color:var(--blue)}.amber{color:var(--amber)}.idle{color:#69717a}.group{margin:0 10px 8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#15181c}.group-label{height:29px;background:#292d31;padding:0 11px;display:flex;align-items:center;font-size:10px;color:#a7abb0}.group-machine{margin-left:auto;color:#747a82}.agent-row{height:52px;padding:0 10px;display:flex;align-items:center;gap:9px;border-top:1px solid var(--border);position:relative}.agent-row:first-of-type{border-top:0}.status-action{width:25px;height:25px;border-radius:6px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent;font-size:12px}.status-action.review{color:var(--blue)}.status-action.clock:before{content:"◷"}.status-action.review:before{content:"✓"}.status-dot{width:9px;height:9px;border-radius:50%;background:currentColor;margin-left:2px}.collapsed-note{font-size:10px;color:var(--dim);margin-left:auto}.children{margin:0 10px 9px 53px;border-left:1px solid var(--line)}.child{height:35px;display:flex;align-items:center;gap:8px;padding:0 9px;color:var(--muted);font-size:10.5px;position:relative}.child:before{content:"";position:absolute;left:-1px;top:17px;width:10px;border-top:1px solid var(--line)}.child .dot{width:7px;height:7px}.terminal{grid-column:2;grid-row:2;min-width:0;background:#111315;padding:10px}.pane{height:100%;border:1px solid #38404a;border-radius:10px;overflow:hidden;background:#15181c;display:flex;flex-direction:column}.pane-head{height:35px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:9px;font-size:11px;color:var(--muted)}.pane-head strong{color:var(--fg);font-size:12px}.api{font-size:9px;background:#4b4024;color:#e8c766;border-radius:5px;padding:3px 6px}.path{margin-left:3px;color:#727983}.pane-body{flex:1;padding:30px 34px 22px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:15px;line-height:1.5;color:#d8dbe0;overflow:hidden}.prompt{border-left:2px solid var(--violet);background:#20242a;padding:13px 15px;margin-bottom:28px;color:#f0f1f3}.tool-label{font-style:italic;color:#a9afb7;margin:22px 0 10px}.tool{background:#20372c;border:1px solid #2d523f;border-radius:2px;padding:15px;margin:0 0 18px;color:#bdcfbf}.success{color:#7ed9a5}.accent{color:#bfa7ff}.warn{color:#e4bc5d}.terminal-copy{margin-top:20px;max-width:910px}.terminal-copy p{margin:0 0 15px}.terminal-footer{margin-top:auto;border-top:1px solid #4d4261;color:#a99bbd;padding-top:17px;display:flex;justify-content:space-between}.retained{position:absolute;inset:0;background:#0008;display:grid;place-items:center}.dialog{width:1120px;height:760px;background:#111417;border:1px solid #424a55;border-radius:12px;box-shadow:0 30px 90px #000b;display:flex;flex-direction:column;overflow:hidden}.dialog-head{height:55px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:11px}.dialog-head .archive{margin-left:2px}.dialog-title{font-size:13px;font-weight:650}.dialog-sub{font-size:10px;color:var(--dim);margin-top:3px}.dialog-close{margin-left:auto;color:var(--muted);font-size:20px}.dialog-body{padding:22px 26px;font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;line-height:1.55;color:#cfd3d8;white-space:pre-wrap}.agents-list{padding:12px 10px}.tree-space{font-size:10px;color:#6f757d;margin:16px 10px 8px}.tree-agent{height:39px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:7px;color:#d7d9dd;font-size:11.5px}.tree-agent.selected{background:#24282e}.indent1{margin-left:22px}.indent2{margin-left:44px}.tree-line{width:9px;border-top:1px solid #454b53}.hint{margin:auto 14px 14px;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:#15181c;font-size:10px;color:var(--muted)}.hint kbd{background:#282d33;border:1px solid #3c424b;border-radius:4px;padding:2px 5px;color:#ddd}.action-menu{position:absolute;z-index:4;top:294px;right:18px;width:210px;background:#20242a;border:1px solid #464d57;border-radius:9px;box-shadow:0 16px 42px #000b;padding:6px}.action-menu:before{content:"";position:absolute;top:-6px;right:15px;width:10px;height:10px;background:#20242a;border-left:1px solid #464d57;border-top:1px solid #464d57;transform:rotate(45deg)}.menu-title{padding:7px 9px 5px;color:#717781;text-transform:uppercase;letter-spacing:.08em;font-size:9px}.menu-item{height:33px;border-radius:6px;display:flex;align-items:center;padding:0 9px;gap:9px;font-size:11px;color:#d6d9dd}.menu-item:first-of-type{background:#2b3037}.menu-icon{width:15px;color:#aeb4bc;text-align:center}.menu-shortcut{margin-left:auto;color:#737a84;font-size:9px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const scene=new URLSearchParams(location.search).get('scene')||'inbox';
const icon='<div class="agent-icon">◆</div>';
const row=(title,sub,color,action='clock')=>`<div class="agent-row">${icon}<div class="row-copy"><div class="row-title">${title}</div><div class="row-sub">${sub}</div></div><div class="status-action ${action}"></div><span class="status-dot ${color}"></span></div>`;
const shell=(sidebar,overlay='')=>`<div class="top-left"><div class="brand-mark">H</div><div class="brand">Herdr</div></div><div class="top"><div class="tab"><span class="tab-icon">◆</span> Launch coordinator <span class="tab-close">×</span></div><div class="top-spacer"></div><div class="demo-pill">Demo data</div></div>${sidebar}<main class="terminal"><div class="pane"><div class="pane-head"><span class="tab-icon">◆</span><strong>Pi</strong><span class="api">API</span><span class="path">~/demo/product-launch</span></div><div class="pane-body"><div class="prompt">Coordinate the release, escalate real decisions, and keep independent work moving.</div><div class="tool-label">Checking rollout readiness</div><div class="tool">✓ API contract tests passed<br>✓ Migration dry run completed<br><span class="warn">● Waiting for deployment window decision</span></div><div class="terminal-copy"><p><span class="success">Three workstreams are healthy.</span> The payments migration needs a rollback-window decision; search is retrying a failed shard; mobile checkout is ready for review.</p><p>I will keep unaffected work moving and return only when the queue changes.</p></div><div class="terminal-footer"><span>── Working</span><span>gpt-6 · medium</span></div></div></div></main>${overlay}`;
function inbox(children=false){return `<aside class="sidebar"><div class="inbox-head"><div class="head-row"><div class="head-title"><span class="archive"></span>Inbox</div><div class="attention-total">4</div></div><div class="machine-count">2 active machines · 0 offline</div></div><div class="current">${icon}<div class="row-copy"><div class="row-title">Launch coordinator</div><div class="row-sub">Current · This computer</div></div><span class="chev">›</span><span class="child-count">◇ 4</span></div>${children?`<div class="children"><div class="child"><span class="dot fill amber"></span>api-contracts · working</div><div class="child"><span class="dot fill red"></span>payments-migration · blocked</div><div class="child"><span class="dot fill blue"></span>mobile-checkout · finished</div><div class="child"><span class="dot idle"></span>release-notes · idle</div></div>`:''}<section class="section"><div class="section-head"><span class="chev">⌄</span><span class="dot fill red"></span><strong>Needs you</strong><span class="count red">2</span></div><div class="group"><div class="group-label">Checkout platform <span class="group-machine">This computer</span></div>${row('Payments migration','Worker asks which rollback window to use','red')}${row('Search reindex','shard-03 failed after 14m · retry paused','red')}</div></section><section class="section"><div class="section-head"><span class="chev">⌄</span><span class="dot fill blue"></span><strong>Ready to review</strong><span class="count blue">2</span></div><div class="group"><div class="group-label">Storefront <span class="group-machine">Build host</span></div>${row('Mobile checkout','Finished · tests passed · preview ready','blue','review')}${row('Documentation refresh','Finished · 8 pages updated','blue','review')}</div></section><section class="section"><div class="section-head"><span class="chev">›</span><span class="dot amber"></span><strong>Working</strong><span class="count amber">3 active</span></div></section><section class="section"><div class="section-head"><span class="chev">›</span><span class="dot idle"></span><strong>Idle</strong><span class="count">4</span></div></section><div class="hint"><kbd>⌘⇧I</kbd> Agents &nbsp; <kbd>⌘⇧J/K</kbd> actionable items</div></aside>`}
function agents(){return `<aside class="sidebar"><div class="inbox-head"><div class="head-row"><div class="head-title">◇ Agents</div></div><div class="machine-count">Managed terminal tree</div></div><div class="agents-list"><div class="tree-space">Checkout platform</div><div class="tree-agent selected"><span class="dot amber"></span>Launch coordinator</div><div class="tree-agent indent1"><span class="tree-line"></span><span class="dot amber"></span>api-contracts</div><div class="tree-agent indent1"><span class="tree-line"></span><span class="dot red fill"></span>payments-migration</div><div class="tree-agent indent2"><span class="tree-line"></span><span class="dot amber"></span>schema-check</div><div class="tree-agent indent1"><span class="tree-line"></span><span class="dot blue fill"></span>mobile-checkout</div><div class="tree-space">Operations</div><div class="tree-agent"><span class="dot amber"></span>Search reindex</div><div class="tree-agent indent1"><span class="tree-line"></span><span class="dot red fill"></span>shard-03</div></div><div class="hint"><kbd>⌘⇧I</kbd> Return to Inbox</div></aside>`}
const overlay=`<div class="retained"><div class="dialog"><div class="dialog-head"><span class="archive"></span><div><div class="dialog-title">Mobile checkout</div><div class="dialog-sub">Retained session · demo/session-04</div></div><div class="dialog-close">×</div></div><div class="dialog-body"><span class="success">✓ Build completed</span>\n<span class="success">✓ 42 tests passed</span>\n<span class="success">✓ Preview deployed</span>\n\nChanged\n  src/checkout/payment-sheet.tsx\n  src/checkout/payment-sheet.test.tsx\n  docs/mobile-checkout.md\n\nReview notes\n  • Preserves the existing desktop flow\n  • Adds accessible mobile focus order\n  • No migration required\n\nReady for review.</div></div></div>`;
const actions=`<div class="action-menu"><div class="menu-title">Handle this item</div><div class="menu-item"><span class="menu-icon">✓</span>Acknowledge<span class="menu-shortcut">until activity</span></div><div class="menu-item"><span class="menu-icon">◷</span>Snooze<span class="menu-shortcut">5 minutes</span></div><div class="menu-item"><span class="menu-icon">◷</span>Snooze<span class="menu-shortcut">1 hour</span></div><div class="menu-item"><span class="menu-icon">↗</span>Open without handling</div></div>`;
const actionSidebar=inbox(false).replace('</aside>',actions+'</aside>');
app.innerHTML=scene==='agents'?shell(agents()):scene==='retained'?shell(inbox(false),overlay):scene==='actions'?shell(actionSidebar):shell(inbox(scene==='children'));
</script>
</body>
</html>
